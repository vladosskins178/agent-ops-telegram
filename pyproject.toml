[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-ops-telegram"
version = "0.1.0"
description = "Run a coding agent (Claude Code, Codex CLI or any terminal CLI) 24/7 in tmux on a server and talk to it from your phone through a Telegram bot, without losing messages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Vladislav Y" }]
keywords = ["telegram", "telegram-bot", "tmux", "claude-code", "codex", "coding-agent", "systemd", "watchdog", "devops", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "tomli>=2.0"]  # tomli: lets mypy check the 3.10 import path

[project.scripts]
aot = "agent_ops_telegram.cli:main"

[project.urls]
Homepage = "https://github.com/vladosskins178/agent-ops-telegram"
Issues = "https://github.com/vladosskins178/agent-ops-telegram/issues"
Changelog = "https://github.com/vladosskins178/agent-ops-telegram/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ops_telegram"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agent-ops-telegram/SKILL.md" = "agent_ops_telegram/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "AGENTS.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "SIM105", "PTH101", "PTH105", "PTH109", "PTH111", "PTH123", "E501"]  # E501: ruff format owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tmux: needs a real tmux binary (skipped when tmux is missing)"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/agent_ops_telegram", "tests"]
